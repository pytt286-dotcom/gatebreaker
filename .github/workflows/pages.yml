name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['notifier/.keepalive']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write, actions: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/calc.test.mjs tests/notifier.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # new cache name per deploy, so phones pick up every update
      - run: sed -i "s/pt-system-v1/pt-system-${GITHUB_SHA::7}/" app/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: app }
      - id: deployment
        uses: actions/deploy-pages@v5
